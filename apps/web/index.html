<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS — Department Ecosystem Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;550;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply theme before paint to prevent flash
      (function() {
        document.documentElement.setAttribute('data-theme', 'light');
      })();
    </script>
  </head>
  <body class="font-body antialiased" style="background: var(--bg-base); color: var(--text-primary)">
    <div id="root">
      <div id="startup-status" role="status" style="padding:48px;font:16px system-ui;color:#202020;background:#fff">
        <h1 style="font-size:24px">Loading NEXUS…</h1>
        <p id="startup-message">Connecting to your workspace.</p>
        <button type="button" onclick="window.location.reload()" style="padding:10px 18px;cursor:pointer">Reload</button>
      </div>
    </div>
    <noscript><p style="padding:32px;color:#202020;background:#fff">NEXUS requires JavaScript. Enable JavaScript in your browser to open the workspace.</p></noscript>
    <script>
      // This runs without the app bundle so module-loading failures stay visible.
      (function () {
        function showStartupFailure(message) {
          var status = document.getElementById('startup-status');
          if (!status) return;
          status.querySelector('h1').textContent = 'NEXUS could not finish loading';
          document.getElementById('startup-message').textContent = message;
        }
        window.addEventListener('error', function (event) {
          showStartupFailure(event.message || 'A required script could not be loaded. Please reload.');
        });
        window.addEventListener('unhandledrejection', function (event) {
          showStartupFailure(event.reason instanceof Error
            ? event.reason.message
            : 'The app could not start. Please reload.');
        });
        window.setTimeout(function () {
          showStartupFailure('The app scripts have not started. Please share this message so we can investigate the connection.');
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
